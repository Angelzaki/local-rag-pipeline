[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-pipeline"
version = "0.1.0"
description = "Pipeline RAG 100% local: ingest, retrieve, answer con citas"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Angel Salazar" }]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[project.scripts]
local-rag = "local_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
